[package]
name = "ls10-nt"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
eframe = "0.37.0"
serialport = "4.10.1"
anyhow = "1"
serde_json = "1"
sha2 = "0.11"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
